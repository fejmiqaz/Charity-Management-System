<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>(function () {
        document.documentElement.dataset.theme = localStorage.getItem('charity-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.lang = localStorage.getItem('charity-language') || 'en'
    }());</script>
    <title>Create Account</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="auth-page">
<div class="auth-preferences"><select id="appLanguage" aria-label="Language">
    <option value="en">EN</option>
    <option value="sq">SQ</option>
    <option value="fr">FR</option>
    <option value="de">DE</option>
</select>
    <button type="button" id="themeToggle" aria-label="Switch color theme"><span aria-hidden="true">◐</span></button>
</div>
<aside class="auth-story"><a class="auth-brand" th:href="@{/login}">♥ &nbsp; Charity</a>
    <div><p class="auth-eyebrow">PEOPLE. PURPOSE. IMPACT.</p>
        <h2>Make room<br>for good.</h2>
        <p>One place to bring your people together,<br>organize your work, and make a difference.</p>
        <div class="auth-flower" aria-hidden="true">✳</div>
    </div>
    <small>A little organization. A lot of possibility.</small></aside>

<div class="auth-container">
    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="auth-description">
            Register to access the Charity Management System.
        </p>

        <div class="alert alert-danger"
             th:if="${registrationError}"
             th:text="${registrationError}">
        </div>

        <form th:action="@{/register}"
              th:object="${registrationDto}"
              method="post">

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">First Name</label>
                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="Enter your first name">
                    <small class="field-error"
                           th:if="${#fields.hasErrors('name')}"
                           th:errors="*{name}">
                    </small>
                </div>

                <div class="form-group">
                    <label for="surname">Last Name</label>
                    <input id="surname"
                           type="text"
                           th:field="*{surname}"
                           class="form-control"
                           placeholder="Enter your last name">
                    <small class="field-error"
                           th:if="${#fields.hasErrors('surname')}"
                           th:errors="*{surname}">
                    </small>
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <input id="country"
                           type="text"
                           th:field="*{country}"
                           class="form-control"
                           placeholder="Country">
                    <small class="field-error"
                           th:if="${#fields.hasErrors('country')}"
                           th:errors="*{country}">
                    </small>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input id="city"
                           type="text"
                           th:field="*{city}"
                           class="form-control"
                           placeholder="City">
                    <small class="field-error"
                           th:if="${#fields.hasErrors('city')}"
                           th:errors="*{city}">
                    </small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input id="phone"
                           type="text"
                           th:field="*{phone}"
                           class="form-control"
                           placeholder="Phone number">
                    <small class="field-error"
                           th:if="${#fields.hasErrors('phone')}"
                           th:errors="*{phone}">
                    </small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email"
                           type="email"
                           required
                           maxlength="254"
                           autocomplete="email"
                           inputmode="email"
                           aria-describedby="email-error"
                           th:attr="aria-invalid=${#fields.hasErrors('email')}"
                           th:field="*{email}"
                           class="form-control"
                           placeholder="Enter your email">
                    <small id="email-error" class="field-error"
                           th:if="${#fields.hasErrors('email')}"
                           th:errors="*{email}">
                    </small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password"
                           type="password"
                           th:field="*{password}"
                           class="form-control"
                           placeholder="Minimum 8 characters"
                           autocomplete="new-password">
                    <small class="field-error"
                           th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}">
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input id="confirmPassword"
                           type="password"
                           th:field="*{confirmPassword}"
                           class="form-control"
                           placeholder="Repeat your password"
                           autocomplete="new-password">
                    <small class="field-error"
                           th:if="${#fields.hasErrors('confirmPassword')}"
                           th:errors="*{confirmPassword}">
                    </small>
                </div>

            </div>

            <button type="submit"
                    class="submit-button" disabled>
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a th:href="@{/login}">Log in</a>
        </p>

    </div>
</div>

<script th:src="@{/js/main.js}" defer></script>
</body>
</html>
