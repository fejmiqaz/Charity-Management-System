<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="history" class="card p-4 mt-4"><h2 class="section-title">My membership</h2>
    <p><strong th:text="${membershipYear}"></strong> <span class="badge"
                                                           th:classappend="${membershipPaid} ? 'badge-finished' : 'badge-pending'"
                                                           th:text="${membershipPaid} ? 'Paid membership' : 'Regular member · no payment recorded'"></span>
    </p>
    <p class="text-secondary"
       th:text="'Annual fee for new payments: €' + ${membershipFee} + '. Contact the treasurer to pay or correct a receipt.'"></p>
    <p th:if="${#lists.isEmpty(membershipHistory)}">No membership payments recorded yet.</p>
    <div class="table-responsive" th:if="${!#lists.isEmpty(membershipHistory)}">
        <table class="table table-branded">
            <thead>
            <tr>
                <th>Year</th>
                <th>Amount</th>
                <th>Paid on</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="payment : ${membershipHistory}">
                <td th:text="${payment.membershipYear}"></td>
                <td th:text="${payment.amount} + ' ' + ${payment.currency}"></td>
                <td th:text="${payment.paidOn}"></td>
                <td th:text="${payment.paid} ? 'Paid' : 'Voided'"></td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
