<!--
  Save as: src/main/resources/templates/base.html

  Every other page "extends" this by adding:
    layout:decorate="~{base}"
  on its <html> tag, and wrapping its page content in:
    <div layout:fragment="content"> ... </div>

  Requires the thymeleaf-layout-dialect dependency — see SETUP-layout-dialect.txt
-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">

    <!-- Child pages override just the <title> text; this pattern wraps it -->
    <title layout:title-pattern="$CONTENT_TITLE - Charity Organization">Charity Organization</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            const saved = localStorage.getItem('charity-theme');
            document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.lang = localStorage.getItem('charity-language') || 'en';
        }());
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- App theme (imports Fraunces / Inter / IBM Plex Mono itself) -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/notifications.css}">

    <!-- Optional: child pages can add page-specific <head> content here -->
    <th:block layout:fragment="head"></th:block>
</head>
<body class="workspace">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<a class="skip-link" href="#mainContent">Skip to content</a>
<div class="workspace-shell">
    <header class="workspace-topbar">
        <div class="topbar-left d-flex align-items-center gap-3">
            <button class="mobile-menu btn btn-outline-secondary"
                    type="button" aria-controls="appSidebar"
                    aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list"></i>
            </button>
            <a class="header-brand" th:href="@{/dashboard}"><span class="header-logo"><i
                    class="bi bi-heart-pulse-fill"></i></span><span
                    data-i18n="Charity Management">Charity Management</span></a>
        </div>

        <button class="mobile-search-trigger btn btn-outline-secondary" type="button" aria-label="Find a page"
                title="Find a page">
            <i class="bi bi-search" aria-hidden="true"></i>
        </button>
        <details th:replace="~{fragments/notifications :: bell}"></details>
        <button class="mobile-actions-toggle btn btn-outline-secondary" type="button"
                aria-controls="mobileActions" aria-expanded="false" aria-label="Open account and settings">
            <i class="bi bi-three-dots-vertical" aria-hidden="true"></i>
        </button>
        <div class="mobile-actions-backdrop" hidden></div>
        <div class="mobile-actions" id="mobileActions" aria-label="Account and settings">
            <div class="mobile-actions-heading"><strong>Account and settings</strong>
                <button class="mobile-actions-close" type="button" aria-label="Close account and settings"><i
                        class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
            <a class="mobile-profile-link" th:href="@{/profile}" sec:authorize="isAuthenticated()"
               th:attr="aria-current=${navigationPath == '/profile' or navigationPath == '/profile/edit' ? 'page' : null}">
                <i class="bi bi-person" aria-hidden="true"></i><span data-i18n="Profile">Profile</span>
            </a>
            <div class="topbar-tools">
                <button type="button" class="jump-trigger" aria-label="Find a page">
                    <i class="bi bi-search"></i>
                    <span>Find a page</span>
                    <kbd>Ctrl K</kbd>
                </button>
            </div>

            <div class="topbar-right">
                <label class="language-control" for="appLanguage"><i class="bi bi-translate"></i><span
                        class="visually-hidden">Language</span>
                    <select id="appLanguage" aria-label="Language">
                        <option value="en">EN</option>
                        <option value="sq">SQ</option>
                        <option value="fr">FR</option>
                        <option value="de">DE</option>
                    </select>
                </label>
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch color theme"
                        title="Switch color theme"><i class="bi bi-moon-stars"></i><span>Theme</span></button>
                <details class="account-menu" sec:authorize="isAuthenticated()">
                    <summary class="account-label account-profile" aria-label="Open account menu">
                        <i class="bi bi-person-circle" aria-hidden="true"></i>
                        <span class="account-copy"><strong sec:authentication="name">Account</strong></span>
                        <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    </summary>
                    <div class="account-menu-panel">
                        <a th:href="@{/profile}"
                           th:attr="aria-current=${navigationPath == '/profile' or navigationPath == '/profile/edit' ? 'page' : null}">
                            <i class="bi bi-person" aria-hidden="true"></i><span data-i18n="Profile">Profile</span>
                        </a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span
                                    data-i18n="Sign out">Sign out</span></button>
                        </form>
                    </div>
                </details>
                <form class="mobile-signout-form" th:action="@{/logout}" method="post"
                      sec:authorize="isAuthenticated()">
                    <button class="mobile-signout" type="submit"><i class="bi bi-box-arrow-right"
                                                                    aria-hidden="true"></i><span data-i18n="Sign out">Sign out</span>
                    </button>
                </form>
            </div>
        </div>
    </header>
    <main id="mainContent" tabindex="-1">
        <!-- Every page's own markup is injected here -->
        <div layout:fragment="content">
            <p>No content available.</p>
        </div>
    </main>

    <!-- Shared delete-confirmation modal, available on every page.
         A list page just needs a button with class "co-delete-trigger"
         (see main.js) inside its delete <form> — no need to repeat this markup. -->
    <div class="modal fade" id="coConfirmDeleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle text-danger me-2"></i>
                        Confirm Deletion
                    </h5>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <p id="coConfirmDeleteText" class="mb-0">
                        Are you sure you want to delete this item?
                    </p>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="button"
                            class="btn btn-danger"
                            id="coConfirmDeleteBtn">
                        <i class="bi bi-trash me-1"></i>
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}" defer></script>
<script th:src="@{/js/currency-preview.js}" defer></script>
<script th:src="@{/js/notifications.js}" defer></script>

<dialog id="pageFinder" class="page-finder" aria-labelledby="finderTitle">
    <div class="finder-heading"><h2 id="finderTitle">Find a page</h2>
        <button class="btn btn-sm btn-outline-secondary" type="button" id="closeFinder">Close</button>
    </div>
    <label for="finderInput" class="visually-hidden">Search navigation</label><input id="finderInput"
                                                                                     class="form-control"
                                                                                     placeholder="Projects, members, donations..."
                                                                                     autocomplete="off">
    <nav id="finderResults" aria-label="Matching pages"></nav>
    <p id="finderEmpty" hidden>No matching pages. Try another section name.</p>
</dialog>
<!-- Optional: child pages can add page-specific scripts here -->
<th:block layout:fragment="scripts"></th:block>

</body>
</html>
