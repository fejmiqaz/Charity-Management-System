<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{base}">
<head>
    <title>Events</title>
</head>
<body>

<div layout:fragment="content" class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">
                Events for Year <span th:text="${year.yearValue}"></span>
            </h1>
            <p class="text-secondary mb-0">Manage this year's events and participants</p>
        </div>
    </div>

    <div class="page-toolbar mb-4">
        <a class="btn btn-dark" th:href="@{/years}">
            <i class="bi bi-arrow-left me-1"></i> Back to Years
        </a>

        <a class="btn btn-outline-dark"
           th:href="@{/years/{yearId}(yearId=${year.id})}">
            <i class="bi bi-info-circle me-1"></i> Year Details
        </a>

        <a class="btn btn-danger"
           th:href="@{/pdf/years/{yearId}/events(yearId=${year.id})}"
           sec:authorize="hasAnyRole('HEAD', 'SUBHEAD', 'TREASURER')">
            <i class="bi bi-file-earmark-pdf me-1"></i>
            Export All Events PDF
        </a>

        <a class="btn btn-success"
           th:href="@{/years/{yearId}/events/add-form(yearId=${year.id})}">
            <i class="bi bi-plus-lg me-1"></i> Add Event
        </a>
    </div>

    <form method="get" th:action="@{/years/{yearId}/events(yearId=${year.id})}" class="card p-3 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-sm-4">
                <label for="filterType" class="form-label">Type</label>
                <select id="filterType" name="type" class="form-select">
                    <option value="">All types</option>
                    <option th:each="type : ${types}" th:value="${type}" th:selected="${type == selectedType}"
                            th:text="${type.name() == 'TASK_BASED' ? 'With tasks' : 'Normal'}"></option>
                </select>
            </div>
            <div class="col-sm-4">
                <label for="filterStatus" class="form-label">Status</label>
                <select id="filterStatus" name="status" class="form-select">
                    <option value="">All statuses</option>
                    <option th:each="status : ${statuses}" th:value="${status}" th:selected="${status == selectedStatus}"
                            th:text="${status.name() == 'UPCOMING' ? 'Upcoming' : 'Past'}"></option>
                </select>
            </div>
            <div class="col-sm-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Apply filters</button>
                <a class="btn btn-outline-dark" th:href="@{/years/{yearId}/events(yearId=${year.id})}">Clear filters</a>
            </div>
        </div>
    </form>

    <div class="empty-state" th:if="${#lists.isEmpty(events)}">
        <i class="bi bi-calendar-event display-6"></i>
        <p class="mt-3 mb-2" th:text="${filtersActive ? 'No events match the selected filters.' : 'No events found for this year.'}"></p>
        <a class="btn btn-success btn-sm"
           th:if="${!filtersActive}" th:href="@{/years/{yearId}/events/add-form(yearId=${year.id})}">
            Create the first event
        </a>
    </div>

    <div class="card p-0" th:if="${!#lists.isEmpty(events)}">
        <div class="table-responsive">
            <table class="table table-branded table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Purpose</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Members</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="event : ${events}">
                    <td th:text="${event.id}"></td>
                    <td class="fw-bold" th:text="${event.purpose}"></td>
                    <td><span class="badge text-bg-light border"
                              th:text="${event.eventType != null and event.eventType.name() == 'TASK_BASED' ? 'With tasks' : 'Normal'}"></span>
                    </td>
                    <td th:text="${#temporals.format(event.date, 'yyyy-MM-dd HH:mm')}"></td>
                    <td><span class="badge text-bg-light border"
                              th:text="${eventStatuses[event.id] == null ? 'Unscheduled' : (eventStatuses[event.id].name() == 'UPCOMING' ? 'Upcoming' : 'Past')}"></span></td>

                    <td>
            <span class="text-secondary"
                  th:if="${event.memberNames == null or #lists.isEmpty(event.memberNames)}">
              No members
            </span>

                        <div class="d-flex flex-wrap gap-2"
                             th:if="${event.memberNames != null and !#lists.isEmpty(event.memberNames)}">
              <span class="badge text-bg-light border p-2"
                    th:each="memberName : ${event.memberNames}"
                    th:text="${memberName}">
              </span>
                        </div>
                    </td>

                    <td>
                        <div class="d-flex flex-wrap gap-2">
                            <a class="btn btn-sm btn-outline-dark"
                               th:href="@{/years/{yearId}/events/{id}(yearId=${year.id}, id=${event.id})}">
                                <i class="bi bi-info-circle me-1"></i> Details
                            </a>

                            <a class="btn btn-sm btn-warning"
                               th:href="@{/years/{yearId}/events/{id}/edit-form(yearId=${year.id}, id=${event.id})}">
                                <i class="bi bi-pencil me-1"></i> Edit
                            </a>

                            <form th:action="@{/years/{yearId}/events/{id}/delete(yearId=${year.id}, id=${event.id})}"
                                  method="post">
                                <button type="button"
                                        class="btn btn-sm btn-danger co-delete-trigger"
                                        th:attr="data-item-label=${event.purpose}">
                                    <i class="bi bi-trash me-1"></i> Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
