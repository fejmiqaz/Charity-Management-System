<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head><title>Edit my profile</title></head><body><div layout:fragment="content" class="container py-4">
<p class="eyebrow">MY PROFILE</p><h1>Edit personal information</h1><p class="text-secondary mb-4">Keep your contact details up to date. All fields are required.</p>
<div class="card p-4 profile-form"><form th:action="@{/profile/edit}" th:object="${profile}" method="post">
<div class="row g-4">
<div class="col-md-6"><label class="form-label" for="name">First name</label><input class="form-control" id="name" type="text" th:field="*{name}" required th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" aria-describedby="name-error"><div class="invalid-feedback" id="name-error" th:errors="*{name}"></div></div>
<div class="col-md-6"><label class="form-label" for="surname">Last name</label><input class="form-control" id="surname" type="text" th:field="*{surname}" required th:classappend="${#fields.hasErrors('surname')} ? 'is-invalid'" aria-describedby="surname-error"><div class="invalid-feedback" id="surname-error" th:errors="*{surname}"></div></div>
<div class="col-md-6"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" type="email" th:field="*{email}" required th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" aria-describedby="email-error"><div class="invalid-feedback" id="email-error" th:errors="*{email}"></div></div>
<div class="col-md-6"><label class="form-label" for="phone">Phone number</label><input class="form-control" id="phone" type="tel" th:field="*{phone}" required th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" aria-describedby="phone-error"><div class="invalid-feedback" id="phone-error" th:errors="*{phone}"></div></div>
<div class="col-md-6"><label class="form-label" for="country">Country</label><input class="form-control" id="country" type="text" th:field="*{country}" required th:classappend="${#fields.hasErrors('country')} ? 'is-invalid'" aria-describedby="country-error"><div class="invalid-feedback" id="country-error" th:errors="*{country}"></div></div>
<div class="col-md-6"><label class="form-label" for="city">City</label><input class="form-control" id="city" type="text" th:field="*{city}" required th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'" aria-describedby="city-error"><div class="invalid-feedback" id="city-error" th:errors="*{city}"></div></div>
</div><div class="profile-email-note mt-4"><i class="bi bi-info-circle me-2"></i>If you change your email, you will be signed out and can sign in again with the new address.</div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Save changes</button><a class="btn btn-outline-secondary" th:href="@{/profile}">Cancel</a></div></form></div>
</div></body></html>
