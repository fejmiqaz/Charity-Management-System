spring.application.name=charitymanagementsystem

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

app.admin.name=${ADMIN_NAME:System Administrator}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}


spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.emd.charitymanagementsystem=DEBUG

logging.file.name=logs/charity-management.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Default annual dues; individual years can be configured on the Memberships page.
app.membership.default-fee=${MEMBERSHIP_DEFAULT_FEE:10.00}
app.public-zone=${PUBLIC_TIME_ZONE:Europe/Skopje}

# Enable only when the app is reached through a trusted proxy that sets X-Forwarded-For.
app.rate-limit.trust-proxy=${RATE_LIMIT_TRUST_PROXY:false}

# In-app alerts run automatically; SMTP delivery is explicitly enabled after setup.
app.notifications.scheduling-enabled=${NOTIFICATIONS_SCHEDULING_ENABLED:true}
app.notifications.email-enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
app.notifications.from=${NOTIFICATIONS_FROM:}
app.notifications.base-url=${APP_BASE_URL:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
